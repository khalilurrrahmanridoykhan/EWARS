server {
    listen 80;
    server_name ewars.commicplan.com;

    root /var/www/ewars.commicplan.com/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static files from public directory
    location ~* \.(json|png|jpg|jpeg|gif|svg|pdf)$ {
        root /var/www/ewars.commicplan.com/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to avoid CORS
    location /api/ {
        proxy_pass http://api1.commicplan.com/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }

    # Proxy LMIS API requests
    location /lmis/ {
        proxy_pass https://lmis.nmcp.gov.bd/;
        proxy_set_header Host lmis.nmcp.gov.bd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36";
        proxy_set_header Accept "application/json, text/plain, */*";
        proxy_set_header Accept-Language "en-US,en;q=0.9";
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Pragma "no-cache";
        proxy_set_header Referer "https://lmis.nmcp.gov.bd/";
        proxy_set_header Origin "https://lmis.nmcp.gov.bd";
        proxy_buffering off;
        proxy_ssl_server_name on;
    }
}